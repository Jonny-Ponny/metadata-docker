name: Tests

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'test/**'
      - 'refactor/**'
      - 'ci/**'
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile backend/*.py backend/routes/*.py

      - name: Run backend tests
        run: python -m pytest -q

      # Coverage is informational: a failure here does not block the job, and
      # no threshold is enforced. The suite runs again so a coverage problem
      # can never turn a passing test run into a failing required check.
      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: python -m pytest -q --cov=backend --cov-report=term-missing

  # Branch protection must require this job in addition to `pytest`; otherwise a
  # failing frontend test still allows a merge.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check Svelte templates
        run: npm run check

      - name: Run frontend tests
        run: npm test

      # Coverage is informational: a failure here does not block the job and no
      # threshold is enforced. The suite runs again so a coverage problem can
      # never turn a passing test run into a failing required check.
      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload frontend coverage (non-blocking)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build frontend
        run: npm run build
