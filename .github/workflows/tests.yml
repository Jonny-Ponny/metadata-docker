name: Backend tests

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'test/**'
      - 'refactor/**'
      - 'ci/**'
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m py_compile backend/*.py backend/routes/*.py

      - name: Run backend tests
        run: python -m pytest -q

      # Coverage is informational: a failure here does not block the job, and
      # no threshold is enforced. The suite runs again so a coverage problem
      # can never turn a passing test run into a failing required check.
      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: python -m pytest -q --cov=backend --cov-report=term-missing
